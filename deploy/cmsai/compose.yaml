name: cmsai
services:
  open-webui:
    build:
      context: ../..
      dockerfile: deploy/cmsai/.artifacts/OpenWebUI.Dockerfile
    image: cmsai/open-webui:local
    network_mode: host
    command: ["bash", "-c", "update-ca-certificates && exec bash start.sh"]
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      WEBUI_URL: http://127.0.0.1:3000
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AIOHTTP_CLIENT_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      ENABLE_PERSISTENT_CONFIG: "False"
      ENABLE_LOGIN_FORM: "False"
      ENABLE_PASSWORD_AUTH: "False"
      ENABLE_SIGNUP: "False"
      ENABLE_LDAP: "False"
      ENABLE_API_KEYS: "False"
      ENABLE_OAUTH: "True"
      ENABLE_OAUTH_SIGNUP: "True"
      OAUTH_AUTO_REDIRECT: "False"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "True"
      OAUTH_PROVIDER_NAME: CERN
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?Set OAUTH_CLIENT_ID in .env}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?Set OAUTH_CLIENT_SECRET in .env}
      OPENID_PROVIDER_URL: https://auth.cern.ch/auth/realms/cern/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://127.0.0.1:7869/redirect
      OAUTH_SCOPES: openid email profile
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URLS: https://ml.cern.ch/serving/genai/kops-llm-serving-ml-prod-qwen-v38-27b/openai/v1
      OPENAI_API_KEYS: ${REMOTE_LLM_API_KEY:?Set REMOTE_LLM_API_KEY in .env}
      # TEMPORARY WORKAROUND: manually renewed CERN ML browser session cookie.
      # The virtual key remains the Bearer credential; this cookie passes ML SSO.
      OPENAI_API_CONFIGS: >-
        {"0":{"auth_type":"bearer","model_ids":["hf-qwen38-27b"],"headers":{"Cookie":"${CERN_ML_SESSION_COOKIE:?Set CERN_ML_SESSION_COOKIE in .env}"}}}
      DEFAULT_MODELS: hf-qwen38-27b
      DEFAULT_MODEL_PARAMS: '{"function_calling":"native"}'
    volumes:
      - open-webui-data:/app/backend/data
      - ./certificates:/usr/local/share/ca-certificates/cmsai:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
  oauth-callback:
    # TEMPORARY WORKAROUND: reuse Archi's registered local OIDC callback.
    image: cmsai/open-webui:local
    network_mode: host
    entrypoint: ["python", "/callback.py"]
    volumes:
      - ./scripts/oauth-callback.py:/callback.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 7869), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  open-webui-data:
