name: cms-tools
groupRef: local-test
backends:
  - name: weather
    url: http://127.0.0.1:18484/mcp
    transport: streamable-http
  - name: unified
    url: https://cmspnr-api.cern.ch/mcp/sse
    transport: streamable-http
incomingAuth:
  type: oidc
  oidc:
    issuer: http://127.0.0.1:4483
    audience: http://127.0.0.1:4483/mcp
    resource: http://127.0.0.1:4483/mcp
outgoingAuth:
  source: inline
  default:
    type: unauthenticated
  backends:
    unified:
      type: upstream_inject
      upstreamInject:
        providerName: unified
aggregation:
  conflictResolution: prefix
  conflictResolutionConfig:
    prefixFormat: "{workload}_"
